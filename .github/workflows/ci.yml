name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with GUI and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: System libraries for Qt and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1 libdbus-1-3 libpulse0
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows, LGPL build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/fetch_binaries.py --platform windows --skip-exiftool
          "${{ github.workspace }}\packaging\bin\windows" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Lint
        run: ruff check framesift tests && ruff format --check framesift tests
      - name: Type check (engine and CLI)
        run: mypy framesift/engine framesift/cli
      - name: Tests (engine and CLI)
        run: python -m pytest -q -p no:cacheprovider tests/unit tests/integration
      - name: Tests (GUI, offscreen)
        if: ${{ !cancelled() }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "qt.multimedia.*=false"
        run: python -m pytest -q -p no:cacheprovider tests/gui
