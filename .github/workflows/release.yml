name: Release

on:
  push:
    tags: ["v*"]
    # Also build and smoke-test the bundles on main when packaging changes, so a broken build
    # shows up before a tag (paths apply to branch pushes only; tags always run). Such runs
    # publish nothing: the Docker job and the draft release are tag-only.
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            platform: macos
            arch: arm64
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            arch: x86_64
          - os: windows-latest
            label: windows-x64
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Fetch exiftool (and ffmpeg on Windows/Linux)
        run: python packaging/fetch_binaries.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Cache the macOS LGPL ffmpeg build
        if: matrix.platform == 'macos'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: packaging/bin/macos/ffmpeg*
          key: ffmpeg-lgpl-7.1.1-${{ matrix.arch }}-v1
      - name: Build LGPL ffmpeg from source (macOS)
        if: matrix.platform == 'macos' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install nasm pkg-config
          bash packaging/macos/build_ffmpeg.sh 7.1.1
      - name: Linux system libraries for Qt
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1 libdbus-1-3 libpulse0 libfuse2
      - name: Smoke test the engine with bundled binaries on PATH
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$PWD/packaging/bin/${{ matrix.platform }}:$PATH"
          python -m pytest -q -p no:cacheprovider tests/unit
      - name: PyInstaller
        shell: bash
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/framesift.spec
      - name: Bundle smoke test (CLI and app from the bundle)
        run: python packaging/smoke_bundle.py ${{ matrix.platform }}
      - name: Package (macOS DMG)
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/make_dmg.sh ${{ matrix.arch }}
      - name: Package (Windows zip)
        if: matrix.platform == 'windows'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: python packaging/windows/make_zip.py
      - name: Package (Linux AppImage)
        if: matrix.platform == 'linux'
        run: bash packaging/linux/make_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: framesift-${{ matrix.label }}
          path: |
            packaging/out/*.dmg
            packaging/out/*.zip
            packaging/out/*.AppImage
          if-no-files-found: error

  docker:
    name: docker (amd64 + arm64)
    if: startsWith(github.ref, 'refs/tags/v')  # main is covered by docker.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/framesift
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"  # no .dockerbuild artifact next to the bundles
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: draft release
    needs: [build-desktop, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: framesift-*
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          python - <<'EOF' > release_notes.md
          import re, pathlib
          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8") if pathlib.Path("CHANGELOG.md").exists() else ""
          m = re.search(rf"^## \[?{re.escape(tag)}\]?.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print((m.group(1).strip() if m else "See CHANGELOG.md.") + "\n\nDocker: `ghcr.io/${{ github.repository_owner }}/framesift:" + tag + "`")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Framesift ${{ github.ref_name }}
          body_path: release_notes.md
          files: release/*
