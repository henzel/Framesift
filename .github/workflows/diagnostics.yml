name: Diagnostics (temporary)

# Temporary: verify the fix for the Windows-only access violations in the GUI tests
# (ARCHITECTURE.md decision 26).
# Every experiment is continue-on-error, so the run stays green and sends no failure mail.
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnostics.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.multimedia.*=false"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: ffmpeg (LGPL build)
        shell: pwsh
        run: |
          python packaging/fetch_binaries.py --platform windows --skip-exiftool
          "${{ github.workspace }}\packaging\bin\windows" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Versions
        continue-on-error: true
        run: |
          python - <<'PY'
          import sqlite3, sys
          import numpy, PIL, pi_heif, PySide6
          from PySide6 import QtCore
          print(sys.version)
          print("sqlite", sqlite3.sqlite_version, "threadsafety", sqlite3.threadsafety)
          print("PySide6", PySide6.__version__, "Qt", QtCore.qVersion())
          libheif = getattr(pi_heif, "libheif_version", lambda: "?")()
          print("pi_heif", pi_heif.__version__, "libheif", libheif, "Pillow", PIL.__version__, "numpy", numpy.__version__)
          PY
      - name: Helper scripts
        run: |
          cat > run_gui.sh <<'SH'
          # usage: run_gui.sh LABEL COUNT [pytest args...]
          label=$1; count=$2; shift 2
          for i in $(seq 1 "$count"); do
            python -m pytest -q -p no:cacheprovider "$@" tests/gui > "gui_${label}_$i.log" 2>&1
            rc=$?
            crash=no; grep -q 'Windows fatal exception' "gui_${label}_$i.log" && crash=yes
            echo "RESULT $label run $i rc=$rc crash=$crash dups=$(grep -c '^DUP' "gui_${label}_$i.log") :: $(tail -1 "gui_${label}_$i.log")"
            if [ "$crash" = yes ]; then
              grep -A120 'Windows fatal exception' "gui_${label}_$i.log" | grep -v -E 'site-packages|frozen runpy' | head -70
            fi
            grep '^DUP' "gui_${label}_$i.log" | cut -c1-300 | head -10
          done
          SH
          cat > dup_probe.py <<'PY'
          """Report C++ addresses that map to more than one live shiboken wrapper (stale entries)."""
          from collections import defaultdict

          import pytest
          from shiboken6 import Shiboken

          from framesift.gui.models import tree


          def dups(tag):
              by_addr = defaultdict(list)
              for w in Shiboken.getAllValidWrappers():
                  try:
                      by_addr[Shiboken.getCppPointer(w)[0]].append(w)
                  except Exception:
                      pass
              for addr, ws in by_addr.items():
                  if len(ws) > 1:
                      names = " | ".join(type(w).__name__ for w in ws)
                      print(f"\nDUP[{tag}] 0x{addr:x}: {names}", flush=True)


          _orig = tree.FolderTreeModel.rebuild


          def rebuild(self):
              dups("before-rebuild")
              _orig(self)


          tree.FolderTreeModel.rebuild = rebuild


          @pytest.hookimpl(trylast=True)
          def pytest_runtest_teardown(item):
              dups(f"teardown {item.name}")
          PY
      - name: A. GUI tests, as in CI (x16)
        continue-on-error: true
        run: bash run_gui.sh A 16
      - name: B. GUI tests with the wrapper-map probe (x2)
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: bash run_gui.sh B 2 -s -p dup_probe
