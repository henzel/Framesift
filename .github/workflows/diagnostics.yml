name: Diagnostics (temporary)

# Temporary: find the source of the Windows-only access violations in the GUI tests.
# Every experiment is continue-on-error, so the run stays green and sends no failure mail.
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnostics.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.multimedia.*=false"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: ffmpeg (LGPL build)
        shell: pwsh
        run: |
          python packaging/fetch_binaries.py --platform windows --skip-exiftool
          "${{ github.workspace }}\packaging\bin\windows" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Versions
        continue-on-error: true
        run: |
          python - <<'PY'
          import sqlite3, sys
          import numpy, PIL, pi_heif, PySide6
          from PySide6 import QtCore
          print(sys.version)
          print("sqlite", sqlite3.sqlite_version, "threadsafety", sqlite3.threadsafety)
          print("PySide6", PySide6.__version__, "Qt", QtCore.qVersion())
          libheif = getattr(pi_heif, "libheif_version", lambda: "?")()
          print("pi_heif", pi_heif.__version__, "libheif", libheif, "Pillow", PIL.__version__, "numpy", numpy.__version__)
          PY
      - name: Helper scripts
        run: |
          cat > run_gui.sh <<'SH'
          # usage: run_gui.sh LABEL COUNT
          for i in $(seq 1 "$2"); do
            python -m pytest -q -p no:cacheprovider tests/gui > "gui_$1_$i.log" 2>&1
            rc=$?
            crash=no; grep -q 'Windows fatal exception' "gui_$1_$i.log" && crash=yes
            echo "RESULT $1 run $i rc=$rc crash=$crash :: $(tail -1 "gui_$1_$i.log")"
            if [ "$crash" = yes ]; then
              grep -A120 'Windows fatal exception' "gui_$1_$i.log" | grep -v -E 'site-packages|frozen runpy' | head -70
            fi
          done
          SH
          cat > heif_stress.py <<'PY'
          import pathlib, sys, threading, time
          sys.path.insert(0, ".")
          from framesift.engine.imaging import decode_heif
          threads, rounds = int(sys.argv[1]), int(sys.argv[2])
          files = sorted(pathlib.Path("tests/fixtures/bin").glob("*.heic"))
          errors = []
          def work(k):
              try:
                  for i in range(rounds):
                      for f in files:
                          im, src = decode_heif(f, max_side=(320 if (i + k) % 2 else None))
                          im.load(); im.tobytes()
              except Exception as exc:
                  errors.append(repr(exc))
          t0 = time.time()
          pool = [threading.Thread(target=work, args=(k,)) for k in range(threads)]
          [t.start() for t in pool]; [t.join() for t in pool]
          print(f"heif stress {threads}x{rounds}x{len(files)} in {time.time() - t0:.1f}s errors {errors[:3]}")
          PY
      - name: A. GUI tests, as in CI (x4)
        continue-on-error: true
        run: bash run_gui.sh A 4
      - name: B. GUI tests without the HEIC fixtures (x4)
        continue-on-error: true
        run: |
          mkdir -p ../heic_off && mv tests/fixtures/bin/*.heic ../heic_off/
          bash run_gui.sh B 4
          mv ../heic_off/*.heic tests/fixtures/bin/
      - name: C. GUI tests on the native windows platform (x4)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: windows
        run: bash run_gui.sh C 4
      - name: D. HEIF decode stress in 8 threads, no Qt (x3)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            python heif_stress.py 8 200 > heif_$i.log 2>&1; rc=$?
            echo "RESULT D run $i rc=$rc :: $(tail -1 heif_$i.log)"
            [ $rc -ne 0 ] && grep -A60 'Windows fatal exception' heif_$i.log | head -40
          done
          true
      - name: E. Enable full page heap for python.exe
        continue-on-error: true
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name GlobalFlag -Value '0x02000000' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $k -Name PageHeapFlags -Value '0x3' -PropertyType String -Force | Out-Null
          Get-ItemProperty $k | Select-Object GlobalFlag, PageHeapFlags
      - name: F. GUI tests under full page heap (x2)
        continue-on-error: true
        run: bash run_gui.sh F 2
      - name: G. HEIF decode stress under full page heap
        continue-on-error: true
        run: |
          python heif_stress.py 8 40 > heif_ph.log 2>&1; rc=$?
          echo "RESULT G rc=$rc :: $(tail -1 heif_ph.log)"
          [ $rc -ne 0 ] && grep -A60 'Windows fatal exception' heif_ph.log | head -40
          true
