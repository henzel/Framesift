name: Delete failed runs

# Removes failed, timed-out and never-started workflow runs from the Actions list. Runs once
# when this file changes on main, and on demand from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    paths: [".github/workflows/delete-failed-runs.yml"]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for status in failure timed_out startup_failure; do
            gh run list --status "$status" --limit 500 \
              --json databaseId,workflowName,displayTitle \
              --jq '.[] | "\(.databaseId)\t\(.workflowName): \(.displayTitle)"'
          done > runs.tsv
          echo "$(wc -l < runs.tsv) run(s) to delete"
          while IFS=$'\t' read -r id title; do
            echo "delete $id  $title"
            gh run delete "$id" || echo "::warning::could not delete run $id ($title)"
          done < runs.tsv
