name: Docker edge

on:
  push:
    branches: [main]
    paths:
      - "framesift/**"
      - "pyproject.toml"
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/framesift:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the amd64 image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/framesift:edge --version
          docker run --rm --entrypoint sh ghcr.io/${{ github.repository_owner }}/framesift:edge -c "ffmpeg -version | head -1 && exiftool -ver"
